name: Shell Installation Test

on:
  push:
    branches: [main]
  pull_request:
    branches:
      - "*"
  workflow_dispatch:

jobs:
  test-shells:
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: ["ubuntu-latest", "macos-latest"]
        shell: ["zsh", "fish", "bash"]
      fail-fast: false

    steps:
      - uses: actions/checkout@v4

      - name: Install Zsh and Fish on Ubuntu
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y zsh fish

      - name: Install Zsh and Fish on MacOS
        if: matrix.os == 'macos-latest'
        run: |
          brew install zsh fish

      # Each job installs from its shell the way a user whose login shell it is
      # does: `bash ./install.bash` run from that shell, with $SHELL naming it
      # (the runner's login shell is bash). The home directory is the runner's
      # own, not seeded with config files: macOS has no ~/.zshrc, like a fresh
      # account. macOS has brew, so it takes the Homebrew path; Linux takes the
      # manual one.
      - name: Test install script in Zsh
        if: matrix.shell == 'zsh'
        run: SHELL=$(command -v zsh) bash ./install.bash
        shell: zsh {0}
      - name: Test install script in Fish
        if: matrix.shell == 'fish'
        run: SHELL=(command -v fish) bash ./install.bash
        shell: fish {0}
      - name: Test install script in Bash
        if: matrix.shell == 'bash'
        run: SHELL=$(command -v bash) bash ./install.bash
        shell: bash {0}

      - name: Verify installation
        env:
          LOGIN_SHELL: ${{ matrix.shell }}
        run: |
          set -euo pipefail
          hooks="$HOME/.shelltime/hooks"
          case "$LOGIN_SHELL" in
            zsh)  rc="$HOME/.zshrc" ;;
            bash) rc="$HOME/.bashrc" ;;
            fish) rc="$HOME/.config/fish/config.fish" ;;
          esac
          ls -la "$HOME/.shelltime" "$hooks"

          # Both paths download every shell's hook, and the bash-preexec.sh bash.bash sources
          for f in zsh.zsh bash.bash bash-preexec.sh fish.fish; do
            [ -s "$hooks/$f" ] || { echo "$hooks/$f is missing or empty"; exit 1; }
          done
          [ -d "$HOME/.shelltime/daemon" ] || { echo "$HOME/.shelltime/daemon is missing"; exit 1; }

          # The login shell's config exists and sources its hook
          [ -f "$rc" ] || { echo "$rc was not created"; exit 1; }
          grep -qxF "source $hooks/$LOGIN_SHELL.$LOGIN_SHELL" "$rc" || { echo "$rc does not source the $LOGIN_SHELL hook:"; cat "$rc"; exit 1; }

          if [ "$RUNNER_OS" = macOS ]; then
            # Homebrew: the cask links both binaries into brew's bin dir, and
            # nothing is left in ~/.shelltime/bin to shadow them
            brew list --cask shelltime
            bin="$(brew --prefix)/bin"
            [ ! -e "$HOME/.shelltime/bin/shelltime" ] || { echo "$HOME/.shelltime/bin/shelltime shadows the cask"; exit 1; }
          else
            # Manual: both binaries go in ~/.shelltime/bin, which the config puts on PATH
            bin="$HOME/.shelltime/bin"
            grep -qF '$HOME/.shelltime/bin' "$rc" || { echo "$rc does not put ~/.shelltime/bin on PATH:"; cat "$rc"; exit 1; }
          fi
          [ -x "$bin/shelltime" ] || { echo "$bin/shelltime is missing"; exit 1; }
          [ -x "$bin/shelltime-daemon" ] || { echo "$bin/shelltime-daemon is missing"; exit 1; }
          "$bin/shelltime" --version

          # A new shell (one reading the config, as a new terminal does) has the
          # hook loaded and runs this shelltime. The hook may print on startup,
          # so the path is the last line.
          case "$LOGIN_SHELL" in
            zsh)  found=$(zsh -i -c '(( $+functions[preexec] && $+functions[precmd] )) && command -v shelltime' | tail -n 1) ;;
            bash) found=$(bash -i -c '[[ " ${preexec_functions[*]} " == *" preexec_invoke_cmd "* && " ${precmd_functions[*]} " == *" precmd_invoke_cmd "* ]] && command -v shelltime' | tail -n 1) ;;
            # fish reads config.fish in every shell, interactive or not
            fish) found=$(fish -c 'functions -q fish_preexec fish_postexec; and command -v shelltime' | tail -n 1) ;;
          esac || true
          [ "$found" = "$bin/shelltime" ] || { echo "a new $LOGIN_SHELL shell did not load the hook and run $bin/shelltime (last line: '$found')"; exit 1; }

  test-cloud:
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        # x86_64 and arm64, the two Linux builds cloud.bash downloads
        os: ["ubuntu-latest", "ubuntu-24.04-arm"]
      fail-fast: false

    steps:
      - uses: actions/checkout@v4

      - name: Outside a cloud environment cloud.bash installs nothing
        run: |
          set -euo pipefail
          out=$(cat ./cloud.bash | env -u CLAUDE_CODE_REMOTE bash 2>&1) || { echo "$out"; echo "cloud.bash exited non-zero"; exit 1; }
          echo "$out"
          echo "$out" | grep -q "only runs in Claude Code cloud environments" || { echo "missing the refusal"; exit 1; }
          [ ! -e "$HOME/.shelltime" ] || { echo "~/.shelltime was created"; exit 1; }

      - name: Run cloud.bash the way a setup script does, twice
        run: |
          set -euo pipefail
          for run in 1 2; do
            # A cloud environment's setup script runs with CLAUDE_CODE_REMOTE=true
            out=$(cat ./cloud.bash | CLAUDE_CODE_REMOTE=true bash 2>&1) || { echo "$out"; echo "cloud.bash exited non-zero"; exit 1; }
            echo "$out"
            echo "$out" | grep -q "ShellTime is installed" || { echo "run $run did not finish"; exit 1; }
          done

      - name: Verify installation
        run: |
          set -euo pipefail
          hook="$HOME/.shelltime/bin/cloud-session-start.sh"
          settings="$HOME/.claude/settings.json"
          "$HOME/.shelltime/bin/shelltime" --version
          [ -x "$HOME/.shelltime/bin/shelltime-daemon" ] || { echo "shelltime-daemon missing"; exit 1; }
          [ -x "$hook" ] || { echo "SessionStart hook missing"; exit 1; }
          jq -e '.env.OTEL_EXPORTER_OTLP_ENDPOINT' "$settings"
          count=$(jq --arg cmd "$hook" '[.hooks.SessionStart[].hooks[] | select(.command == $cmd)] | length' "$settings")
          [ "$count" = 1 ] || { echo "expected one SessionStart hook, found $count"; exit 1; }
          config="$HOME/.shelltime/config.yaml"
          daemon="$HOME/.shelltime/bin/shelltime-daemon"
          # The hook prints nothing: a SessionStart hook's output goes into Claude's context
          # Without SHELLTIME_TOKEN it signs in with the network secret's placeholder
          out=$(env -u SHELLTIME_TOKEN "$hook")
          [ -z "$out" ] || { echo "hook printed: $out"; exit 1; }
          grep -qx "token: proxy-injected" "$config" || { echo "expected the proxy-injected token"; cat "$config"; exit 1; }
          # and starts the daemon, once
          for _ in 1 2 3 4 5; do pgrep -fx "$daemon" >/dev/null && break; sleep 1; done
          pgrep -fx "$daemon" >/dev/null || { echo "daemon not started"; cat "$HOME/.shelltime/logs/shelltime-daemon.log"; exit 1; }
          # SHELLTIME_TOKEN takes the placeholder's place, and back again once it's gone
          out=$(SHELLTIME_TOKEN=st_v1_ci_token "$hook")
          [ -z "$out" ] || { echo "hook printed: $out"; exit 1; }
          grep -qx "token: st_v1_ci_token" "$config" || { echo "expected SHELLTIME_TOKEN"; cat "$config"; exit 1; }
          env -u SHELLTIME_TOKEN "$hook"
          grep -qx "token: proxy-injected" "$config" || { echo "expected the proxy-injected token again"; cat "$config"; exit 1; }
          [ "$(pgrep -fxc "$daemon")" = 1 ] || { echo "expected one daemon"; pgrep -fxa "$daemon"; exit 1; }
          pkill -fx "$daemon"
