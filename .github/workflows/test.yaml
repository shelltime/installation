name: Shell Installation Test

on:
  push:
    branches: [main]
  pull_request:
    branches:
      - "*"
  workflow_dispatch:

jobs:
  test-shells:
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: ["ubuntu-latest", "macos-latest"]
        shell: ["zsh", "fish", "bash"]
      fail-fast: false

    steps:
      - uses: actions/checkout@v4

      - name: Install Zsh and Fish on Ubuntu
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y zsh fish

      - name: Install Zsh and Fish on MacOS
        if: matrix.os == 'macos-latest'
        run: |
          brew install zsh fish

      - name: Setup shell environment
        run: |
          mkdir -p ~/.config/fish
          mkdir -p ~/.zsh
          touch ~/.bashrc

      - name: Test install script in Zsh
        if: matrix.shell == 'zsh'
        run: |
          bash ./install.bash
        shell: zsh {0}
      - name: Test install script in Fish
        if: matrix.shell == 'fish'
        run: |
          bash ./install.bash
        shell: fish {0}

      - name: Verify installation
        run: |
          if [ "${{ matrix.shell }}" = "zsh" ]; then
            zsh -c "source ~/.zshrc && echo 'Zsh configuration loaded'"
          elif [ "${{ matrix.shell }}" = "fish" ]; then
            fish -c "source ~/.config/fish/config.fish && echo 'Fish configuration loaded'"
          elif [ "${{ matrix.shell }}" = "bash" ]; then
            bash -c "source ~/.bashrc && echo 'Bash configuration loaded'"
          fi
          [ -f ~/.shelltime/hooks/bash-preexec.sh ] || (echo "bash-preexec.sh not found in ~/.shelltime/hooks!" && exit 1)
          ls ~/.shelltime
          if command -v brew >/dev/null 2>&1 && brew list shelltime >/dev/null 2>&1; then
            which shelltime || (echo "shelltime not in PATH via Homebrew!" && exit 1)
          else
            ls ~/.shelltime/bin
          fi
          ls ~/.shelltime/hooks

  test-cloud:
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        # x86_64 and arm64, the two Linux builds cloud.bash downloads
        os: ["ubuntu-latest", "ubuntu-24.04-arm"]
      fail-fast: false

    steps:
      - uses: actions/checkout@v4

      - name: Outside a cloud environment cloud.bash installs nothing
        run: |
          set -euo pipefail
          out=$(cat ./cloud.bash | env -u CLAUDE_CODE_REMOTE bash 2>&1) || { echo "$out"; echo "cloud.bash exited non-zero"; exit 1; }
          echo "$out"
          echo "$out" | grep -q "only runs in Claude Code cloud environments" || { echo "missing the refusal"; exit 1; }
          [ ! -e "$HOME/.shelltime" ] || { echo "~/.shelltime was created"; exit 1; }

      - name: Run cloud.bash the way a setup script does, twice
        run: |
          set -euo pipefail
          for run in 1 2; do
            # A cloud environment's setup script runs with CLAUDE_CODE_REMOTE=true
            out=$(cat ./cloud.bash | CLAUDE_CODE_REMOTE=true bash 2>&1) || { echo "$out"; echo "cloud.bash exited non-zero"; exit 1; }
            echo "$out"
            echo "$out" | grep -q "ShellTime is installed" || { echo "run $run did not finish"; exit 1; }
          done

      - name: Verify installation
        run: |
          set -euo pipefail
          hook="$HOME/.shelltime/bin/cloud-session-start.sh"
          settings="$HOME/.claude/settings.json"
          "$HOME/.shelltime/bin/shelltime" --version
          [ -x "$HOME/.shelltime/bin/shelltime-daemon" ] || { echo "shelltime-daemon missing"; exit 1; }
          [ -x "$hook" ] || { echo "SessionStart hook missing"; exit 1; }
          jq -e '.env.OTEL_EXPORTER_OTLP_ENDPOINT' "$settings"
          count=$(jq --arg cmd "$hook" '[.hooks.SessionStart[].hooks[] | select(.command == $cmd)] | length' "$settings")
          [ "$count" = 1 ] || { echo "expected one SessionStart hook, found $count"; exit 1; }
          config="$HOME/.shelltime/config.yaml"
          daemon="$HOME/.shelltime/bin/shelltime-daemon"
          # The hook prints nothing: a SessionStart hook's output goes into Claude's context
          # Without SHELLTIME_TOKEN it signs in with the network secret's placeholder
          out=$(env -u SHELLTIME_TOKEN "$hook")
          [ -z "$out" ] || { echo "hook printed: $out"; exit 1; }
          grep -qx "token: proxy-injected" "$config" || { echo "expected the proxy-injected token"; cat "$config"; exit 1; }
          # and starts the daemon, once
          for _ in 1 2 3 4 5; do pgrep -fx "$daemon" >/dev/null && break; sleep 1; done
          pgrep -fx "$daemon" >/dev/null || { echo "daemon not started"; cat "$HOME/.shelltime/logs/shelltime-daemon.log"; exit 1; }
          # SHELLTIME_TOKEN takes the placeholder's place, and back again once it's gone
          out=$(SHELLTIME_TOKEN=st_v1_ci_token "$hook")
          [ -z "$out" ] || { echo "hook printed: $out"; exit 1; }
          grep -qx "token: st_v1_ci_token" "$config" || { echo "expected SHELLTIME_TOKEN"; cat "$config"; exit 1; }
          env -u SHELLTIME_TOKEN "$hook"
          grep -qx "token: proxy-injected" "$config" || { echo "expected the proxy-injected token again"; cat "$config"; exit 1; }
          [ "$(pgrep -fxc "$daemon")" = 1 ] || { echo "expected one daemon"; pgrep -fxa "$daemon"; exit 1; }
          pkill -fx "$daemon"
